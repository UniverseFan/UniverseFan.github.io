name: 发布 Work
description: 记录项目复盘、工作思考或职业经历。
title: "[Work] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      placeholder: 用一两句话说明这篇工作记录。
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: 标签
      description: 用英文逗号分隔。
      placeholder: backend, project
  - type: textarea
    id: content
    attributes:
      label: 正文
      description: 支持 Markdown。图片可直接拖入编辑器。
      placeholder: 从这里开始写。
    validations:
      required: true
