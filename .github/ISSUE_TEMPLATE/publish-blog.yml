name: 发布 Blog
description: 写下日常、玩乐或任何想记录的事。
title: ""
labels: ["publish-blog"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      placeholder: 用一两句话留下这篇内容的引子。
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: 标签
      description: 用英文逗号分隔。
      placeholder: life, travel
  - type: textarea
    id: content
    attributes:
      label: 正文
      description: 支持 Markdown。图片可直接拖入编辑器。
      placeholder: 从这里开始写。
    validations:
      required: true
