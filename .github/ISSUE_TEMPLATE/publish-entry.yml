name: 发布一条内容
description: 选择栏目，写下内容并拖入图片，提交后会自动发布到网站。
title: ""
labels: ["publish-entry"]
body:
  - type: dropdown
    id: section
    attributes:
      label: 发布到
      options:
        - Blog
        - Cook
        - Learn
        - Work
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 会显示在栏目列表中。
      placeholder: 用一两句话留下这篇内容的引子。
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: 标签
      description: 用英文逗号分隔。
      placeholder: life, travel
    validations:
      required: false
  - type: textarea
    id: content
    attributes:
      label: 正文
      description: 支持 Markdown。图片可直接拖入编辑器。
      placeholder: 从这里开始写。
    validations:
      required: true
