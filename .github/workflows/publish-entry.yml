name: Publish entry

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Create published entry
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = "<!-- site-entry:published -->";
            const titleMatch = issue.title.match(/^\[(Blog|Cook|Learn|Work)\]\s*(.+)$/i);
            if (!titleMatch || (issue.body || "").includes(marker)) {
              core.notice("未发布：标题需以 [Blog]、[Cook]、[Learn] 或 [Work] 开头，且内容只会发布一次。");
              return;
            }
            const readSection = (label) => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const pattern = new RegExp(`### ${escaped}\\n([\\s\\S]*?)(?=\\n### |$)`);
              return ((issue.body || "").match(pattern)?.[1] || "").trim();
            };
            const collection = titleMatch[1].toLowerCase();
            const title = titleMatch[2].trim();
            const rawBody = (issue.body || "").trim();
            const body = readSection("正文") || rawBody;
            const summary = (readSection("摘要") || title).replace(/\s+/g, " ").slice(0, 180);
            const tags = readSection("标签").split(",").map((tag) => tag.trim()).filter(Boolean);
            if (!body) {
              core.setFailed("Issue 正文不能为空。");
              return;
            }
            const date = issue.created_at.slice(0, 10);
            const path = `src/content/${collection}/${date}-${issue.number}.md`;
            const frontmatter = [
              "---",
              `title: ${JSON.stringify(title)}`,
              `description: ${JSON.stringify(summary)}`,
              'icon: "1"',
              `pubDate: ${JSON.stringify(date)}`,
              `tags: ${JSON.stringify(tags)}`,
              "published: true",
              "---",
              "",
            ].join("\n");
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `${collection}: ${title}`,
              content: Buffer.from(`${frontmatter}${body}\n`).toString("base64"),
              branch: context.payload.repository.default_branch,
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: `已发布到 **${collection}**，等待 GitHub Pages 部署完成。`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: "closed",
              body: `${rawBody}\n\n${marker}`,
            });
